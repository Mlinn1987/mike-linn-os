[project]
name = "mike-os"
version = "0.1.0"
description = "Mike OS tools: Notion context packs and integrations"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
